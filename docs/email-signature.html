    · Outlook → File → Options → Mail → Signatures
    · Apple Mail → Mail → Settings → Signatures

  All styles are inline (mail clients strip external CSS / class-based

  identically in Outlook and Titan.

  Update the founder name + role in the line marked CUSTOMISE.
-->
